services:
  #PostgreSQL 
  db:
    image: postgres:16-alpine
    container_name: family_movie_db
    restart: always
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_DB: ${PG_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  #Adminer
  adminer:
    image: adminer
    container_name: family_movie_adminer
    ports:
      - "8082:8080"

  web:
    build: .
    container_name: family_movies_app
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - /mnt/sda1:/mnt/sda1

volumes:
  pgdata: